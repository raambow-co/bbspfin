      { id: 'goa', state: 'Goa', city: 'Goa Hub', projects: '12 Active Projects', role: 'Eco-Hospitality Real Estate developments & Micro-Solar Microgrids.' },

    function matchQuery(query) {
      const q = query.trim().toLowerCase();
      if (!q) return null;
      let best = null, maxScore = 0;
      Object.values(PILLARS).forEach(p => {
        let score = 0;
        p.suggestedQueries.forEach(sq => {
          if (q.includes(sq.toLowerCase())) score += 10;
        });
        p.intentKeywords.forEach(kw => {
          if (q.includes(kw)) score += 3;
        });
        if (score > maxScore) { maxScore = score; best = p; }
      });
      return maxScore > 0 ? best : null;
    }

        const res = matchQuery(query);
        setMatchedPillar(res);
        if (res) setSelectedCat(res.id);
      }, [query]);

        setQuery(text);
        setSelectedCat(catId);
        document.getElementById('pathways').scrollIntoView({ behavior: 'smooth' });

                <a href="#pathways" className="hover:text-[#E2B049]">Business Pillars</a>
                <a href="#synergy" className="hover:text-[#E2B049]">Synergy Concept</a>
                <a href="#regional" className="hover:text-[#E2B049]">Regional Reach</a>
              </nav>

                Partner With Us
              </button>
            </div>
          </header>

              </span>
              
              <h1 className="mb-6 flex justify-center">
                <span className="sr-only">Build Bharat Synergy Partners</span>
                <div className="bg-white/95 backdrop-blur-md px-8 py-5 rounded-3xl border border-white/20 shadow-xl inline-block max-w-xs sm:max-w-md">
                  <img 
                    src="./build-bharat-logo.png" 
                    alt="Build Bharat Synergy Partners Logo" 
                    className="h-44 sm:h-64 w-auto object-contain mx-auto"

                </div>
              </h1>

                    className="w-full bg-transparent border-none outline-none text-white placeholder-slate-500 text-sm sm:text-base font-medium"

                  </ul>
                </div>
                <div className="bg-slate-950 p-6 rounded-xl border border-white/10 text-center space-y-4">
                  <div className="text-4xl">☀️ ↔ 💰 ↔ 🏢 ↔ 🎓</div>
                  <div className="text-xs text-[#E2B049] font-bold">100% COLLABORATIVE NETWORK</div>
                  <p className="text-slate-400 text-xs">Four independent industry leaders sharing technology, infrastructure, and vision.</p>
                </div>
              </div>
            </div>
          </section>

          {/* REGIONAL REACH */}
          <section id="regional" className="py-20 px-6 bg-[#090D16] border-t border-white/10">
            <div className="max-w-6xl mx-auto">
              <div className="mb-8">
                <span className="text-[#E2B049] text-xs font-bold uppercase tracking-widest block mb-1">GEOGRAPHIC FOOTPRINT</span>
                <h2 className="text-3xl sm:text-4xl font-extrabold heading-font text-white">Regional Operations</h2>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-3">
                  {REGIONS.map(r => (
                    <button
                      key={r.id}
                      onClick={() => setActiveRegion(r)}
                      className={`w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between ${
                        activeRegion.id === r.id ? 'bg-slate-800 border-[#E2B049] text-white' : 'glass-panel border-white/10 text-slate-400'
                      }`}
                    >
                      <div>
                        <h4 className="font-bold text-sm text-white heading-font">{r.state}</h4>
                        <span className="text-xs text-slate-400">{r.city}</span>
                      </div>
                      <span className="text-xs font-semibold text-[#E2B049] bg-[#E2B049]/10 px-2.5 py-1 rounded-full">
                        {r.projects}
                      </span>
                    </button>
                  ))}
                </div>

                <div className="lg:col-span-7 glass-panel p-8 rounded-2xl border border-white/15 bg-slate-900/90 flex flex-col justify-between">
                  <div>
                    <span className="text-xs text-slate-400 uppercase font-bold block mb-1">STATE HUB HIGHLIGHT</span>
                    <h3 className="text-2xl font-bold text-white heading-font mb-4">{activeRegion.state} - {activeRegion.city}</h3>
                    <div className="bg-white/5 p-4 rounded-xl border border-white/10 text-slate-300 text-sm leading-relaxed mb-6">
                      {activeRegion.role}
                    </div>
                  </div>
                  <div className="text-xs text-slate-400 pt-4 border-t border-white/10 flex justify-between">
                    <span>Verified Operational Hub</span>
                    <span className="text-[#E2B049] font-semibold">{activeRegion.projects}</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* PARTNERSHIP CTA */}
          <section className="py-20 px-6 text-center bg-grid-pattern">
            <div className="max-w-4xl mx-auto glass-panel p-10 rounded-3xl border border-[#E2B049]/30">
              <h2 className="text-3xl sm:text-5xl font-extrabold heading-font text-white mb-2">“Build something bigger.”</h2>
              <p className="text-xl font-bold gradient-gold heading-font mb-6">Find your path. Build your future.</p>
              <button onClick={() => setPartnerModal(true)} className="btn-gold px-8 py-3 rounded-full text-sm font-bold uppercase tracking-wider">
                Partner With Build Bharat
              </button>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-[#05070D] text-slate-400 py-12 px-6 border-t border-white/10 text-sm">
            <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-center md:text-left">
              {/* Brand Col */}
              <div className="space-y-4">
                <div className="flex justify-center md:justify-start items-center">
                  <img 
                    src="./build-bharat-logo.png" 
                    alt="Build Bharat Synergy Partners" 
                    className="h-16 w-auto object-contain brightness-0 invert opacity-80" 
                  />
                </div>
                <p className="text-slate-500 leading-relaxed text-sm sm:text-base max-w-sm">
                  Build Bharat Synergy Partners is a multi-brand corporate ecosystem bringing together specialized industry leaders across Renewable Energy, Financial Services, Real Estate, and EdTech.
                </p>
              </div>

              {/* Corporate Office */}
              <div className="space-y-4">
                <h4 className="text-[#E2B049] font-extrabold uppercase tracking-wider text-xs sm:text-sm">Corporate Office</h4>
                <p className="leading-relaxed text-sm sm:text-base">
                  5-76/03, Surya Vamsi Nagar,<br />
                  Hayath Nagar, Hyderabad
                </p>
                <div className="flex flex-col gap-2 font-bold text-slate-300 text-sm sm:text-base">
                  <a href="tel:+919353018855" className="hover:text-[#E2B049] flex items-center justify-center md:justify-start gap-2 transition-colors">
                    📞 <span>+91 93530 18855</span>
                  </a>
                  <a href="mailto:sudheer@buildbharatsp.com" className="hover:text-[#E2B049] flex items-center justify-center md:justify-start gap-2 transition-colors">
                    ✉️ <span>sudheer@buildbharatsp.com</span>
                  </a>
                  <a href="https://www.buildbharatsp.com" target="_blank" rel="noreferrer" className="hover:text-[#E2B049] flex items-center justify-center md:justify-start gap-2 transition-colors">
                    🌐 <span>www.buildbharatsp.com</span>
                  </a>
                </div>
                <div className="text-xs sm:text-sm text-slate-500 pt-1">
                  <strong>MD:</strong> D Sudheer Reddy
                </div>
              </div>

              {/* Active Hubs */}
              <div className="space-y-4">
                <h4 className="text-[#E2B049] font-extrabold uppercase tracking-wider text-xs sm:text-sm">Active Hubs</h4>
                <div className="space-y-2 text-slate-400 font-semibold text-sm sm:text-base">
                  <span className="block text-slate-200 font-bold">Hyderabad, TS (HQ)</span>
                  <span className="block">Bengaluru & Hubli, KA</span>
                  <span className="block">Goa</span>
                  <span className="block">Tamil Nadu</span>
                  <span className="block">Vijayawada & Vizag, AP</span>
                </div>
              </div>
            </div>

            <div className="max-w-6xl mx-auto mt-10 pt-6 border-t border-white/5 text-center text-slate-500 text-xs sm:text-sm">
              <p>© {new Date().getFullYear()} Build Bharat Synergy Partners. All operating entities remain independent corporate brands.</p>
            </div>
          </footer>

          {/* COMPANY MODAL */}
          {modalCompany && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="glass-panel max-w-xl w-full p-8 rounded-2xl border border-white/20 relative bg-[#0F1626]">
                <button onClick={() => setModalCompany(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <span className="text-xs font-bold text-[#E2B049] uppercase block mb-1">ENTERPRISE PROFILE</span>
                <h3 className="text-2xl font-bold text-white heading-font mb-2">{modalCompany.name}</h3>
                <p className="text-slate-300 text-sm mb-4">{modalCompany.fullDescription}</p>
                <div className="bg-slate-950 p-4 rounded-xl border border-white/10 mb-6 space-y-2">
                  <span className="text-xs font-bold text-slate-400 block uppercase">Ecosystem Synergy:</span>
                  <p className="text-xs text-[#E2B049]">{modalCompany.synergy}</p>
                </div>
                <button 
                  onClick={() => { alert(`Official Website Link: ${modalCompany.websiteUrl}`); }}
                  className="btn-gold w-full py-3 rounded-full text-xs font-bold"
                >
                  Visit Official Website ↗
                </button>
              </div>
            </div>
          )}

          {/* PARTNER FORM MODAL */}
          {partnerModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="glass-panel max-w-md w-full p-8 rounded-2xl border border-white/20 relative bg-[#0F1626]">
                <button onClick={() => { setPartnerModal(false); setFormSubmitted(false); }} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                
                {formSubmitted ? (
                  <div className="text-center py-6">
                    <div className="text-4xl mb-2">✅</div>
                    <h3 className="text-xl font-bold text-white heading-font mb-2">Inquiry Submitted!</h3>
                    <p className="text-xs text-slate-300 mb-4">Our Build Bharat representative will respond to your email shortly.</p>
                    <button onClick={() => { setPartnerModal(false); setFormSubmitted(false); }} className="btn-gold px-6 py-2 rounded-full text-xs">Done</button>
                  </div>
                ) : (
                  <div>
                    <h3 className="text-xl font-bold text-white heading-font mb-1">Partner With Build Bharat</h3>
                    <p className="text-xs text-slate-400 mb-4">Initiate business collaboration or enterprise partnership.</p>
                    <form onSubmit={(e) => { e.preventDefault(); setFormSubmitted(true); }} className="space-y-3">
                      <input required type="text" placeholder="Full Name *" className="w-full bg-slate-950 border border-white/15 rounded-xl px-4 py-2 text-white text-xs" />
                      <input required type="email" placeholder="Email Address *" className="w-full bg-slate-950 border border-white/15 rounded-xl px-4 py-2 text-white text-xs" />
                      <select className="w-full bg-slate-950 border border-white/15 rounded-xl px-3 py-2 text-white text-xs">
                        <option value="solar">☀️ Solar / Renewable Energy</option>
                        <option value="loans">💰 Loans / Financial Services</option>
                        <option value="real-estate">🏢 Real Estate</option>
                        <option value="education">🎓 Education / EdTech</option>
                      </select>
                      <textarea placeholder="Describe your requirement..." rows="3" className="w-full bg-slate-950 border border-white/15 rounded-xl px-4 py-2 text-white text-xs resize-none"></textarea>
                      <button type="submit" className="btn-gold w-full py-2.5 rounded-full text-xs font-bold">Submit Inquiry</button>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
