    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/favicon-192x192.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9353018855"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9353018855');

    <title>Build Bharat Synergy Partners | Multi-Industry Business Ecosystem</title>
    <meta name="description" content="Build Bharat Synergy Partners is a connected ecosystem of industry-leading businesses in Solar Renewable Energy, Financial Loans, Real Estate, and EdTech." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root"></div>

    <!-- Vite Module script for node / dev server environment -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fallback redirect if viewed directly as local file without Vite server -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const rootEl = document.getElementById('root');
          if (rootEl && rootEl.children.length === 0 && window.location.protocol === 'file:') {
            window.location.href = './standalone.html';
          }
        }, 800);
      });
    </script>
  </body>
</html>
